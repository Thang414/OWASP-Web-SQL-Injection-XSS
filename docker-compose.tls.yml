# Cấu hình Docker Compose bổ sung để thử nghiệm HTTPS/TLS cục bộ cho app-secured (ANM-27 / ANM-45)
# Chỉ lắng nghe 127.0.0.1:8443 phục vụ kiểm thử cờ Secure cookie trên lab cục bộ.
# Cách dùng:
#   keytool -genkeypair -alias lab-secured -keyalg RSA -keysize 2048 -storetype PKCS12 \
#     -keystore ./certs/lab-secured.p12 -validity 365 -storepass changeit_local_lab -dname "CN=localhost"
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build web-secured
services:
  web-secured:
    ports:
      - "127.0.0.1:${TLS_PORT_SECURED:-8443}:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=tls
      - SERVER_PORT=8443
      - SESSION_COOKIE_SECURE=true
      - SERVER_SSL_KEY_STORE=file:/app/certs/lab-secured.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-changeit_local_lab}
      - SERVER_SSL_KEY_ALIAS=lab-secured
    volumes:
      - ${SSL_KEYSTORE_PATH:-./certs/lab-secured.p12}:/app/certs/lab-secured.p12:ro
