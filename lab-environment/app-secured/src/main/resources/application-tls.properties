# Cấu hình profile TLS/HTTPS cục bộ cho app-secured (ANM-27 / ANM-45)
# Kích hoạt bằng: SPRING_PROFILES_ACTIVE=tls và gắn keystore PKCS12 cục bộ
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:/app/certs/lab-secured.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit_local_lab}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:lab-secured}

# Khi chạy qua HTTPS, bắt buộc gắn cờ Secure cho cookie phiên SECUREDSESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
