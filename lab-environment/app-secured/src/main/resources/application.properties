server.port=${SERVER_PORT:8081}
spring.application.name=websec-app-secured

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình Cơ sở dữ liệu MariaDB / MySQL
db.host=${DB_HOST:db}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:ecommerce_db}
db.user=${DB_USER:db_user}
db.pass=${DB_PASS:P@ssword123}

# Cấu hình trang lỗi an toàn, ẩn chi tiết nội bộ & SQL (CORE-07)
server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Tách cookie xác thực khỏi phiên của app vulnerable trên cùng hostname.
server.servlet.session.cookie.name=SECUREDSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
