<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Tìm kiếm - UTH E-Shop (Vulnerable Java Spring Boot)</title>
    <style th:replace="~{fragments/layout :: sharedStyles}"></style>
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --primary-light: #fee2e2;
            --bg-base: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }
        .back-nav {
            margin-bottom: 20px;
        }
        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s;
        }
        .back-nav a:hover { color: var(--primary); }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }
        .search-box button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-heading {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #0f172a;
        }

        .debug-sql {
            background: #1e293b;
            color: #4ade80;
            padding: 16px 20px;
            border-radius: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin: 20px 0;
            word-break: break-all;
            font-size: 13.5px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            line-height: 1.6;
        }
        .error-sql {
            background: #fef2f2;
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 15px 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            border: 1px solid #fecaca;
            font-size: 13px;
        }

        .product-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-2px);
            border-color: #fca5a5;
            box-shadow: 0 8px 16px rgba(220, 38, 38, 0.08);
        }
        .search-thumb {
            width: 110px;
            height: 90px;
            min-width: 110px;
            background: #f8fafc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }
        .search-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .search-details {
            flex: 1;
        }
        .search-details h4 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #0f172a;
        }
        .search-details p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        .price {
            color: var(--primary);
            font-size: 16.5px;
            font-weight: 700;
        }
        .empty-results {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar('search')}"></header>
<div th:replace="~{fragments/layout :: labBanner}"></div>

<div class="container">
    <div th:replace="~{fragments/layout :: systemAlerts}"></div>

    <div class="back-nav">
        <a href="/">⬅ Về Trang chủ</a>
    </div>

    <form class="search-box" action="/search" method="GET">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Nhập tên sản phẩm...">
        <button type="submit">Tìm kiếm</button>
    </form>

    <!-- LỖ HỔNG REFLECTED XSS:
         Sử dụng th:utext (Unescaped Text) thay vì th:text, khiến chuỗi JavaScript độc hại thực thi trực tiếp trên trình duyệt -->
    <h3 class="search-heading">Kết quả tìm kiếm cho: <span th:utext="${keyword}"></span></h3>

    <div class="debug-sql">
        <strong style="color: #ecc94b;">🔍 Câu lệnh SQL thực thi trong Java Backend:</strong><br>
        <code th:text="${sql}"></code>
    </div>

    <div class="error-sql" th:if="${sqlError != null}">
        <strong>Lỗi MySQL:</strong> <span th:text="${sqlError}"></span>
    </div>

    <div class="blank-search-notice" th:if="${isBlankSearch}" style="background: #fffbeb; color: #92400e; padding: 12px 18px; border-radius: 10px; border: 1px solid #fde68a; margin-bottom: 16px; font-size: 14px;">
        ℹ️ Từ khóa tìm kiếm đang trống hoặc chỉ chứa khoảng trắng — Hiển thị toàn bộ danh sách sản phẩm mặc định (<strong th:text="${products != null ? #lists.size(products) : 0}">0</strong> sản phẩm).
    </div>

    <div th:if="${products != null and not #lists.isEmpty(products)}">
        <div class="product-card" th:each="p : ${products}">
            <div class="search-thumb">
                <img th:src="${p.imageUrl}" th:alt="${p.name}" loading="lazy">
            </div>
            <div class="search-details">
                <h4 th:text="${p.name}"></h4>
                <p th:text="${p.description}"></p>
                <div class="price" th:text="${p.formattedPrice}"></div>
            </div>
            <a th:href="@{'/product?id=' + ${p.id}}" style="padding: 8px 14px; background: #fee2e2; color: #dc2626; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none;">Xem chi tiết</a>
        </div>
    </div>
    <div class="empty-results" th:if="${products != null and #lists.isEmpty(products) and (isBlankSearch == null or !isBlankSearch)}">
        <p>Không tìm thấy sản phẩm nào phù hợp với từ khóa "<strong th:text="${keyword}"></strong>"!</p>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>

</body>
</html>
