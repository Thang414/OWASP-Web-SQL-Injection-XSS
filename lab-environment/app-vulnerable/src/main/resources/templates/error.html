<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo lỗi hệ thống - UTH E-Shop (Vulnerable Lab)</title>
    <style th:replace="~{fragments/layout :: sharedStyles}"></style>
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --bg-base: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 24px 60px;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .error-icon {
            font-size: 52px;
            margin-bottom: 14px;
        }
        .error-code-pill {
            display: inline-block;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 12.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }
        .error-card h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
        }
        .error-card p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 560px;
            margin: 0 auto 26px;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-primary-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-secondary-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            background: #f1f5f9;
            color: #334155;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar('error')}"></header>
<div th:replace="~{fragments/layout :: labBanner}"></div>

<div class="container">
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <div class="error-code-pill" th:text="'Mã trạng thái HTTP: ' + (${status != null ? status : 500})">Mã trạng thái HTTP: 500</div>
        <h1 th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra lỗi hoặc trang không tồn tại'}">Đã xảy ra lỗi hoặc trang không tồn tại</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'Dịch vụ tạm thời chưa sẵn sàng hoặc đường dẫn bạn yêu cầu không hợp lệ.'}">
            Dịch vụ tạm thời chưa sẵn sàng hoặc đường dẫn bạn yêu cầu không hợp lệ.
        </p>
        <div class="error-actions">
            <a href="/" class="btn-primary-nav">🏠 Quay về Trang chủ</a>
            <a href="/search" class="btn-secondary-nav">🔍 Tìm kiếm sản phẩm</a>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>

</body>
</html>
