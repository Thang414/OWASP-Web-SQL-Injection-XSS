<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng TMĐT UTH (Vulnerable App - Java Spring Boot)</title>
    <style th:replace="~{fragments/layout :: sharedStyles}"></style>
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --primary-light: #fee2e2;
            --primary-dark: #991b1b;
            --bg-base: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        .search-hero {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 32px 28px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            color: white;
        }
        .search-hero h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .search-hero p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 12px;
            max-width: 760px;
        }
        .search-box input {
            flex: 1;
            padding: 13px 18px;
            font-size: 15px;
            border: 1.5px solid #334155;
            background: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-box input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
        }
        .search-box button {
            padding: 13px 28px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }
        .search-box button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .section-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-count {
            background: #fee2e2;
            color: #b91c1c;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 24px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: #fca5a5;
            box-shadow: 0 12px 24px -6px rgba(220, 38, 38, 0.12);
        }

        .product-thumb {
            position: relative;
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
            border-bottom: 1px solid #f1f5f9;
        }
        .product-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .product-card:hover .product-thumb img {
            transform: scale(1.06);
        }

        .product-category-pill {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            color: #f8fafc;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 9999px;
            letter-spacing: 0.3px;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .product-info h4 {
            font-size: 16.5px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.35;
        }
        .product-info h4 a {
            color: #0f172a;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .product-info h4 a:hover {
            color: var(--primary);
        }
        .product-info p {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.5;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .price {
            font-size: 19px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 14px;
            letter-spacing: -0.2px;
        }
        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff1f2;
            color: #e11d48;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: center;
            justify-content: center;
        }
        .action-link:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar('home')}"></header>
<div th:replace="~{fragments/layout :: labBanner}"></div>

<div class="container">
    <div th:replace="~{fragments/layout :: systemAlerts}"></div>

    <div class="search-hero">
        <h3>Tìm kiếm sản phẩm công nghệ</h3>
        <p>Thử nghiệm tìm kiếm sản phẩm và kịch bản tấn công SQL Injection / Reflected XSS</p>
        <form class="search-box" action="/search" method="GET">
            <input type="text" name="keyword" placeholder="Nhập tên sản phẩm cần tìm kiếm (VD: iPhone, Laptop, Sony...)...">
            <button type="submit">Tìm kiếm</button>
        </form>
    </div>

    <div class="section-header">
        <h3>
            <span>Danh sách sản phẩm nổi bật</span>
            <span class="badge-count" th:text="${products != null ? #lists.size(products) + ' sản phẩm' : '0'}"></span>
        </h3>
    </div>

    <div class="product-grid">
        <div class="product-card" th:each="p : ${products}">
            <div class="product-thumb">
                <span class="product-category-pill" th:text="${p.category}">Danh mục</span>
                <img th:src="${p.imageUrl}" th:alt="${p.name}" loading="lazy">
            </div>
            <div class="product-info">
                <h4><a th:href="@{'/product?id=' + ${p.id}}" th:text="${p.name}"></a></h4>
                <p th:text="${p.description}"></p>
                <div class="price" th:text="${p.formattedPrice}"></div>
                <p><a class="action-link" th:href="@{'/product?id=' + ${p.id}}">👉 Xem chi tiết &amp; Đánh giá</a></p>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>

</body>
</html>
